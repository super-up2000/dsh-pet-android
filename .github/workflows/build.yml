name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 应用 v1.9 功能补丁
        run: |
          set -e
          test -f v19.patch || { echo "缺少 v19.patch"; exit 1; }
          patch -p1 < v19.patch

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 Android SDK cmdline-tools
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          yes 2>/dev/null | ./latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          ./latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 还原素材（从上游 dsh-pet 转码）
        run: |
          set -e
          sudo ln -sf "$(which ffmpeg)" /usr/local/bin/ffmpeg 2>/dev/null || true
          chmod +x tools/fetch-and-transcode.sh
          ./tools/fetch-and-transcode.sh

      - name: 构建 debug APK
        run: |
          set -e
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          ANDROID_HOME=$HOME/android-sdk ./gradlew :app:assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-v1.9-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
